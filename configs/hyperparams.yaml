# ============================================================================
# V3 Architecture Hyperparameters - Scratchpad Chain-of-Thought (Corrected)
# Performance fix: removed pad_to_length, reduced samples/epochs for efficiency
# ============================================================================

# ============================================================================
# MODEL ARCHITECTURE
# ============================================================================
model:
  # Core dimensions
  embed_dim: 768
  num_heads: 12
  head_dim: 64
  num_layers: 16
  dim_feedforward: 3072
  
  # Sequence and vocabulary
  max_len: 128                       # For scratchpad sequences
  vocab_size: 21                      # 16 → 21 (added |, [, ], C, B)
  
  # Architectural choices
  positional_encoding: "rope"
  normalization: "rmsnorm"
  ffn_activation: "swiglu"
  dropout: 0.1
  
  # Memory efficiency
  use_mixed_precision: true
  use_gradient_checkpointing: true

# ============================================================================
# SUPERVISED PRETRAINING (Corrected for performance)
# ============================================================================
training:
  # Data configuration
  num_samples: 150000               # CORRECTED: 500000 → 150000 (avg scratchpad ~45 tokens)
  val_split: 0.05
  max_digits_supervised: 4          # CORRECTED: 3 → 4 (5-digit deferred to v4)
  use_scratchpad: true
  
  # Batch and sequence
  batch_size: 64                    # Reduced for longer sequences
  max_len: 128
  
  # Optimizer
  optimizer: "AdamW"
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  
  # LR Schedule
  lr_scheduler: "cosine_with_warmup"
  warmup_steps: 400                 # CORRECTED: 500 → 400 (proportional to total steps)
  min_lr: 3.0e-6
  
  # Training duration
  epochs: 15                       # CORRECTED: 30 → 15 (each epoch has more meaningful tokens)
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 1e-4
  
  # Loss
  criterion: "CrossEntropyLoss"
  ignore_index: 15                  # PAD token at index 15
  
  # Gradient accumulation (CORRECTED: 4, not 6)
  gradient_accumulation_steps: 4     # Effective batch = 64*4 = 256

# ============================================================================
# RL FINE-TUNING (Corrected curriculum)
# ============================================================================
rl:
  # Episodes (unchanged)
  total_episodes: 10000
  
  # Batch
  batch_size: 64
  
  # Model
  use_model_config: true
  
  # Learning rate
  learning_rate: 5.0e-6
  
  # Sampling
  temperature: 1.0
  temperature_end: 0.6              # Lower final temp
  max_new_tokens: 40                # Scratchpad + answer
  
  # Entropy regularization
  entropy_coef: 0.01
  entropy_coef_end: 0.005
  
  # Gradient clipping
  max_grad_norm: 1.0
  
  # Replay buffer (increased)
  replay_buffer:
    size: 2000
    threshold: 0.99
    sampling_prob: 0.25
  
  # Curriculum (CORRECTED: 2→3→4 digit only, no 5-digit)
  curriculum:
    phase1:
      start_episode: 1
      end_episode: 1200
      max_digits: 2
      
    mix1:
      start_episode: 1200
      end_episode: 2200                 # CORRECTED: 1000-ep transition
      from_max_digits: 2
      to_max_digits: 3
      
    phase2:
      start_episode: 2200
      end_episode: 3800
      max_digits: 3
      
    mix2:
      start_episode: 3800
      end_episode: 4800                 # CORRECTED: 1000-ep transition
      from_max_digits: 3
      to_max_digits: 4
      
    phase3:
      start_episode: 4800
      end_episode: 10000
      max_digits: 4
  
  # Dataset sizes
  dataset_sizes:
    easy: 15000
    medium: 15000
    hard: 30000
  
  # Reward configuration
  reward:
    correct_answer: 1.0
    correct_digit_count: 0.1
    invalid_output: -0.1
    partial_credit_per_digit: 0.15
    scratchpad_step_bonus: 0.2
  
  # Baseline
  baseline_smoothing: 0.05

# ============================================================================
# EVALUATION
# ============================================================================
evaluation:
  num_samples: 500
  max_digits: 4
  print_first_n: 50
  use_scratchpad: false
  
  models_to_evaluate:
    - path: "checkpoints/pretrained_v3.pth"
      name: "Pretrained Model (v3)"
    - path: "checkpoints/rl_finetuned_v3.pth"
      name: "RL Fine-Tuned Model (v3)"

# ============================================================================
# PATHS AND ARTIFACTS
# ============================================================================
paths:
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  plots_dir: "plots"
  logs_dir: "logs"
  mlruns_dir: "mlruns"
  
  pretrained_model: "checkpoints/pretrained_v3.pth"
  rl_model: "checkpoints/rl_finetuned_v3.pth"

# ============================================================================
# PERFORMANCE NOTES
# ============================================================================
# 
# Original v3 design had issues:
# - pad_to_length=128 forced all sequences to 128 tokens
# - 500k samples at 128 tokens = 64M tokens/epoch with ~65% wasted on PAD
# - Result: 2+ hr/epoch, ~70h total supervised
#
# Corrected config:
# - num_samples: 150k (avg scratchpad ~45 tokens → 6.75M tokens/epoch)
# - epochs: 15 (more tokens per epoch, early stopping guards)
# - warmup_steps: 400
# - gradient_accumulation_steps: 4 (effective batch 256)
# - max_digits_supervised: 4 (focus on 4-digit gap; 5-digit deferred to v4)
#
# Expected performance: ~40-50 min/epoch, ~10-13h total supervised
# 6.75M tokens/epoch is 1.5x v2's ~4.5M tokens, with richer supervision