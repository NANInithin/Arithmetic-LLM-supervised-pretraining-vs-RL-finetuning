# ============================================================================
# V4 Architecture Hyperparameters - Modal Cloud + Scaled Scratchpad CoT
# Model: ~310M params (embed=896, layers=24, heads=14, head_dim=64)
# Hardware: Modal A100-40GB (best $/performance for this scale)
# ============================================================================

# ============================================================================
# MODEL ARCHITECTURE
# ============================================================================
model:
  # Core dimensions (v4: scaled 2× from v3's 151M → ~310M)
  embed_dim: 896
  num_heads: 14
  head_dim: 64
  num_layers: 24
  dim_feedforward: 3584
  
  # Sequence and vocabulary
  max_len: 256                       # Room for 5-digit scratchpad (~100 tokens)
  vocab_size: 21                      # Unchanged scratchpad vocab
  
  # Architectural choices
  positional_encoding: "rope"
  normalization: "rmsnorm"
  ffn_activation: "swiglu"
  dropout: 0.1
  
  # Memory efficiency
  use_mixed_precision: true
  # OFF for the H100 (80GB): without checkpointing this config peaks at ~36GB,
  # which OOM'd the 40GB A100 but fits comfortably in 80GB — and skipping the
  # recompute is ~30% faster. If you ever run this on a 40GB card again, set
  # this back to true (or drop batch_size to ~64) to avoid an OOM.
  use_gradient_checkpointing: false

# ============================================================================
# SUPERVISED PRETRAINING (v4: 5-digit curriculum, 2× data)
# ============================================================================
training:
  # Data configuration
  num_samples: 300000               # 2× data for 2× model
  val_split: 0.05
  max_digits_supervised: 5          # Full 5-digit curriculum on Modal
  use_scratchpad: true
  
  # Batch and sequence
  batch_size: 128                   # A100 headroom enables larger batches
  max_len: 256
  
  # Optimizer
  optimizer: "AdamW"
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  
  # LR Schedule
  lr_scheduler: "cosine_with_warmup"
  warmup_steps: 800                 # Proportional to larger dataset
  min_lr: 1.0e-6                    # Lower final LR for better convergence
  
  # Training duration
  epochs: 20                        # More data + bigger model needs more passes
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 1e-4
  
  # Loss
  criterion: "CrossEntropyLoss"
  ignore_index: 15                  # PAD token at index 15
  
  # Gradient accumulation
  gradient_accumulation_steps: 4     # Effective batch = 128*4 = 512

# ============================================================================
# RL FINE-TUNING (v4: 7-phase 2→3→4→5 digit curriculum)
# ============================================================================
rl:
  # Episodes
  total_episodes: 15000
  
  # Batch
  batch_size: 128
  
  # Model
  use_model_config: true
  
  # Learning rate
  learning_rate: 5.0e-6
  
  # Sampling
  temperature: 1.0
  temperature_end: 0.5              # Lower final temp for exploitation
  max_new_tokens: 60                # 5-digit scratchpad needs more tokens
  
  # Entropy regularization
  entropy_coef: 0.01
  entropy_coef_end: 0.003           # Stronger entropy decay
  
  # Gradient clipping
  max_grad_norm: 1.0
  
  # Replay buffer (increased)
  replay_buffer:
    size: 4000
    threshold: 0.99
    sampling_prob: 0.25
  
  # Curriculum: 7 phases (2→3→4→5 digit with smooth mixes)
  curriculum:
    phase1:
      start_episode: 1
      end_episode: 2000
      max_digits: 2
      
    mix1:
      start_episode: 2000
      end_episode: 3000
      from_max_digits: 2
      to_max_digits: 3
      
    phase2:
      start_episode: 3000
      end_episode: 5500
      max_digits: 3
      
    mix2:
      start_episode: 5500
      end_episode: 6500
      from_max_digits: 3
      to_max_digits: 4
      
    phase3:
      start_episode: 6500
      end_episode: 9500
      max_digits: 4
      
    mix3:
      start_episode: 9500
      end_episode: 11000
      from_max_digits: 4
      to_max_digits: 5
      
    phase4:
      start_episode: 11000
      end_episode: 15000
      max_digits: 5
  
  # Dataset sizes
  dataset_sizes:
    easy: 15000
    medium: 15000
    hard: 30000
    very_hard: 30000
  
  # Reward configuration
  reward:
    correct_answer: 1.0
    correct_digit_count: 0.1
    invalid_output: -0.1
    partial_credit_per_digit: 0.15
    scratchpad_step_bonus: 0.2
  
  # Baseline
  baseline_smoothing: 0.05

# ============================================================================
# EVALUATION (v4: scratchpad mode, greedy decoding)
# ============================================================================
evaluation:
  num_samples: 500
  max_digits: 5                     # Evaluate up to 5 digits
  print_first_n: 50
  use_scratchpad: true              # Match training mode
  
  models_to_evaluate:
    - path: "checkpoints/pretrained_v4.pth"
      name: "Pretrained Model (v4)"
    - path: "checkpoints/rl_finetuned_v4.pth"
      name: "RL Fine-Tuned Model (v4)"

# ============================================================================
# PATHS AND ARTIFACTS
# ============================================================================
paths:
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  plots_dir: "plots"
  logs_dir: "logs"
  mlruns_dir: "mlruns"
  
  pretrained_model: "checkpoints/pretrained_v4.pth"
  rl_model: "checkpoints/rl_finetuned_v4.pth"

# ============================================================================
# PERFORMANCE NOTES
# ============================================================================
# 
# Original v3 design had issues:
# - pad_to_length=128 forced all sequences to 128 tokens
# - 500k samples at 128 tokens = 64M tokens/epoch with ~65% wasted on PAD
# - Result: 2+ hr/epoch, ~70h total supervised
#
# Corrected config:
# - num_samples: 150k (avg scratchpad ~45 tokens → 6.75M tokens/epoch)
# - epochs: 15 (more tokens per epoch, early stopping guards)
# - warmup_steps: 400
# - gradient_accumulation_steps: 4 (effective batch 256)
# - max_digits_supervised: 4 (focus on 4-digit gap; 5-digit deferred to v4)
#
# Expected performance: ~40-50 min/epoch, ~10-13h total supervised
# 6.75M tokens/epoch is 1.5x v2's ~4.5M tokens, with richer supervision